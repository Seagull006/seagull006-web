<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An Ecological Guide To BC</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { position: absolute; inset: 0; background: #f0eee8; }
    #title { position: absolute; top: 15px; left: 15px; background: white;
      padding: 10px 13px; border-radius: 5px; box-shadow: 0 1px 5px #8887;
      z-index: 1; max-width: 260px; }
    #title h1 { margin: 0; font-size: 18px; }
    #title p { margin: 5px 0 0; font-size: 12px; }
    #legend { position: absolute; left: 15px; bottom: 25px; background: white;
      padding: 9px 12px; border-radius: 5px; z-index: 1; font-size: 12px;
      box-shadow: 0 1px 5px #8887; max-height: 45vh; overflow-y: auto; }
    #legend summary { cursor: pointer; font-weight: bold; }
    #legend .item { margin-top: 6px; white-space: nowrap; }
    .swatch { display: inline-block; width: 11px; height: 11px; margin-right: 6px;
      border: 1px solid #888; vertical-align: middle; }
    .maplibregl-popup-content { font: 13px/1.5 Arial, sans-serif; max-width: 250px; }
    .maplibregl-popup-content h3 { margin: 0 0 7px; font-size: 16px; }
    .maplibregl-popup-content p { margin: 5px 0; }
    #message { position: absolute; top: 95px; left: 15px; z-index: 2;
      background: #fff5d6; padding: 8px; font-size: 12px; display: none; max-width: 300px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title"><h1>An Ecological Guide To British Columbia</h1><p>British Columbia divided into biogeoclimatic zones (BEC) — click an area to learn more about it's ecological characteristics.</p></div>
  <details id="legend"><summary>Ecological zones</summary><div id="legend-items"></div></details>
  <div id="message"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style2.json',
      center: [-125.5, 54.5],
      zoom: 5
    });
    map.addControl(new maplibregl.NavigationControl());

    const profiles = {};
    const message = document.getElementById('message');
    function warn(text) { message.textContent = text; message.style.display = 'block'; }

    const profilesReady = fetch('zones.csv').then(response => {
      if (!response.ok) throw new Error('zones.csv could not be loaded');
      return response.text();
    }).then(text => {
      const lines = text.trim().split('\n').slice(1);
      for (const line of lines) {
        const [code, name, landscape, climate, vegetation, wildlife] = line.replace(/\r/g, '').split(',');
        profiles[code] = {name, landscape, climate, vegetation, wildlife};
      }
    }).catch(error => console.error('Popup CSV error:', error));

    function makeLegend() {
      const expression = map.getStyle().layers.find(layer => layer.id === 'bec-zones').paint['fill-color'];
      const colors = {};
      if (expression[0] === 'match') {
        for (let i = 2; i < expression.length - 1; i += 2) colors[expression[i]] = expression[i + 1];
      }
      for (const code of Object.keys(profiles).sort()) {
        const item = document.createElement('div');
        item.className = 'item';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = colors[code] || '#ccc';
        item.append(swatch, document.createTextNode(code + ' — ' + profiles[code].name));
        document.getElementById('legend-items').append(item);
      }
    }

    map.on('load', () => {
      if (!map.getLayer('bec-zones')) { warn('BEC layer missing: check style.json.'); return; }
      profilesReady.then(makeLegend);
      map.on('click', 'bec-zones', event => {
        const feature = event.features[0];
        if (!feature) return;
        const code = feature.properties.ZONE;
        const info = profiles[code];
        const box = document.createElement('div');
        const heading = document.createElement('h3');
        heading.textContent = feature.properties.ZONE_NAME || code;
        box.append(heading);
        if (info) {
          for (const key of ['landscape', 'climate', 'vegetation', 'wildlife']) {
            const p = document.createElement('p');
            const b = document.createElement('b');
            b.textContent = key.charAt(0).toUpperCase() + key.slice(1) + ': ';
            p.append(b, document.createTextNode(info[key]));
            box.append(p);
          }
        }
        new maplibregl.Popup().setLngLat(event.lngLat).setDOMContent(box).addTo(map);
      });
      map.on('mouseenter', 'bec-zones', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'bec-zones', () => map.getCanvas().style.cursor = '');
    });
    map.on('error', event => {
      console.error('Map error:', event.error);
      warn('The map could not load. Publish these files together on GitHub Pages and check the Console (F12).');
    });

    if (location.protocol === 'file:') {
      warn('This map uses JSON files. Opening index.html directly from Downloads can block them. Use GitHub Pages instead.');
    }
    // Verify that we are not presenting the government's 1,000-feature preview as complete.
    fetch('bc_bec_zones.geojson').then(r => r.json()).then(data => {
      if (data.exceededTransferLimit === true) {
        warn('Preview data only: the BC server exported its first 1,000 features. Some ecosystems are missing until the full file is substituted.');
      }
    }).catch(() => {});
  </script>
</body>
</html>
